directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
  - from: .electron-runtime/node_modules
    to: node_modules
extraResources:
  - from: electron/computer-use-relay.mjs
    to: computer-use/relay.mjs
  - from: .electron-runtime/omnirush-sentry.json
    to: omnirush-sentry.json
  # Bundled UI-control MCP (scripts/prepare-ui-mcp.mjs). Launched with the app's
  # own binary and ELECTRON_RUN_AS_NODE=1; never fetched from a registry.
  - from: .electron-runtime/omnirush-ui-mcp
    to: omnirush-ui-mcp
    filter:
      - index.mjs
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "*.wasm"
      # The Claude provider is a folder (the engine loads claude-provider/index.js).
      - "claude-provider/*.js"
  - from: ../../packages/docs
    to: omnirush-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
# Electron fuses, flipped in the packaged binary before signing. runAsNode
# stays on: the bundled UI-control and computer-use MCPs, the nuke worker and
# cleanup helpers run this binary with ELECTRON_RUN_AS_NODE=1. Asar integrity
# validation stays off until it is verified on signed macOS/Windows builds.
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
asarUnpack:
  - node_modules/koffi/**
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
publish:
  - provider: github
    owner: omnirush-ai
    repo: omnirush-gui
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The OmniRush VM's limactl is signed on its own (scripts/sign-lima.cjs, from afterPack):
  # Developer ID, hardened runtime and build/entitlements.lima.plist (com.apple.security.virtualization,
  # which Apple's Virtualization.framework requires). The inherited entitlements would replace it.
  signIgnore:
    - /Contents/Resources/sidecars/lima/bin/limactl$
  extendInfo:
    NSMicrophoneUsageDescription: omnirush uses the microphone when you allow a page to access audio input.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode2-aarch64-apple-darwin
        - opencode2-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
        - box/darwin-*/boxsh
        - box/linux-*/boxd
        # The OmniRush VM (backends/lima.ts): boxrun runs boxes inside it; Lima runs the VM.
        - box/linux-*/boxrun
        - lima/bin/limactl
        - lima/share/lima/lima-guestagent.Linux-*.gz
        - lima/LICENSE
    - from: resources/helpers
      to: helpers
      filter:
        - "OmniRush.ai Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/linux
  syncDesktopName: true
  extraResources:
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode2-aarch64-unknown-linux-gnu
        - opencode2-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
        - box/linux-*/boxsh
        - box/linux-*/boxd
        - box/linux-*/boxrun
        - box/linux-*/bwrap
        - box/LICENSE-*
  target:
    - AppImage
    - deb
    - tar.gz
    - pacman
    # Fedora / RHEL (`sudo dnf install ./omnirush-linux-<arch>-<version>.rpm`).
    - rpm
# Arch Linux package (`sudo pacman -U omnirush-linux-<arch>-<version>.pacman`).
# electron-builder's default pacman dependencies name packages Arch no longer
# ships (http-parser) or moved to the AUR (libappindicator-gtk3), which makes
# `pacman -U` fail; these are the ones in packaging/aur/PKGBUILD.
pacman:
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - libdrm
    - libxkbcommon
    - mesa
    - dbus
    - hicolor-icon-theme
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode2-aarch64-pc-windows-msvc.exe
        - opencode2-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
        - box/windows-*/boxsh.exe
        - box/linux-*/boxd
        - box/linux-*/boxrun
  target:
    - nsis
nsis:
  include: build/installer.nsh
  # A reinstall puts back a desktop shortcut that was deleted (for example
  # after Windows offered to delete it while an update was replacing the app).
  createDesktopShortcut: always
