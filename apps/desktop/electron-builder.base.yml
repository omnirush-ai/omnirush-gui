directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
  - from: .electron-runtime/node_modules
    to: node_modules
extraResources:
  - from: .electron-runtime/omnirush-sentry.json
    to: omnirush-sentry.json
  # Bundled UI-control MCP (scripts/prepare-ui-mcp.mjs). Launched with the app's
  # own binary and ELECTRON_RUN_AS_NODE=1; never fetched from a registry.
  - from: .electron-runtime/omnirush-ui-mcp
    to: omnirush-ui-mcp
    filter:
      - index.mjs
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "*.wasm"
  - from: ../../packages/docs
    to: omnirush-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
publish:
  - provider: github
    owner: omnirush-ai
    repo: omnirush-gui
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OmniRush.ai uses the microphone when you allow a page to access audio input.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "OmniRush.ai Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/linux
  syncDesktopName: true
  extraResources:
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - deb
    - tar.gz
    - pacman
# Arch Linux package (`sudo pacman -U omnirush-linux-<arch>-<version>.pacman`).
# electron-builder's default pacman dependencies name packages Arch no longer
# ships (http-parser) or moved to the AUR (libappindicator-gtk3), which makes
# `pacman -U` fail; these are the ones in packaging/aur/PKGBUILD.
pacman:
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - libdrm
    - libxkbcommon
    - mesa
    - dbus
    - hicolor-icon-theme
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    - nsis
nsis:
  include: build/installer.nsh
