name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release
        id: release
        env:
          PUSH_TAG: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="$PUSH_TAG"
          else
            tag="$REQUESTED_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use semantic versioning, such as v1.0.0." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "OmniRush.ai ${RELEASE_TAG}"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            platform: macos
            target: aarch64-apple-darwin
            builder_args: --mac --arm64
            update_manifest: latest-mac.yml
          - name: Windows x64
            runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            builder_args: --win --x64
            update_manifest: latest.yml
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            builder_args: --linux --x64
            update_manifest: latest-linux.yml
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - name: Enable long paths on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools rpm

      - name: Install dependencies
        shell: bash
        run: pnpm --filter @omnirush/desktop... --filter @omnirush/app... --filter omnirush-server... install --frozen-lockfile --prefer-offline

      - name: Stamp release version
        shell: bash
        run: node scripts/release/stamp-version.mjs --version "$RELEASE_VERSION"

      - name: Build desktop application
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: pnpm --filter @omnirush/desktop build:electron

      - name: Package installer
        shell: bash
        run: |
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            ${{ matrix.builder_args }} \
            --publish never

      - name: Verify packaged server imports
        shell: bash
        run: node apps/desktop/scripts/verify-packaged-imports.mjs

      # electron-updater discovers updates through this manifest. A release
      # without it (or with checksums that do not match the uploaded
      # installers) leaves every installed app unable to update.
      - name: Verify update manifest
        env:
          UPDATE_MANIFEST: ${{ matrix.update_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "apps/desktop/dist-electron/$UPDATE_MANIFEST" ]; then
            echo "electron-builder did not emit apps/desktop/dist-electron/$UPDATE_MANIFEST; in-app updates would 404." >&2
            find apps/desktop/dist-electron -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          node apps/desktop/scripts/verify-update-manifest.mjs \
            --manifest "apps/desktop/dist-electron/$UPDATE_MANIFEST" \
            --version "$RELEASE_VERSION"

      - name: Verify and upload installers and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MANIFEST: ${{ matrix.update_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(apps/desktop/dist-electron/omnirush-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No packaged OmniRush.ai assets were produced." >&2
            find apps/desktop/dist-electron -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          manifest="apps/desktop/dist-electron/$UPDATE_MANIFEST"
          if [ ! -f "$manifest" ]; then
            echo "Update manifest $manifest is missing; refusing to publish installers the app cannot update to." >&2
            exit 1
          fi
          assets+=("$manifest")
          printf 'Uploading %s\n' "${assets[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Create checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'omnirush-*'
          cd release-assets
          sha256sum omnirush-* > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
