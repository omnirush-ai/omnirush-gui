name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release
        id: release
        env:
          PUSH_TAG: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="$PUSH_TAG"
          else
            tag="$REQUESTED_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use semantic versioning, such as v1.0.0." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out signing plan
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1
          sparse-checkout: apps/desktop/scripts/signing-plan.mjs
          sparse-checkout-cone-mode: false

      # A 3.x or later release is never published unsigned: fail here, before
      # the draft release exists, when the signing secrets are missing. Only
      # which secret names are set is printed, never a value.
      - name: Require signing secrets for 3.x releases
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: node apps/desktop/scripts/signing-plan.mjs --platform all --version "$RELEASE_VERSION" --enforce

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "OmniRush.ai ${RELEASE_TAG}"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            platform: macos
            target: aarch64-apple-darwin
            builder_args: --mac --arm64
            update_manifest: latest-mac.yml
          - name: Windows x64
            runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            builder_args: --win --x64
            update_manifest: latest.yml
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            builder_args: --linux --x64
            update_manifest: latest-linux.yml
          # Built natively on an arm64 runner, so electron-builder installs
          # and rebuilds the native modules (better-sqlite3, node-pty) for the
          # host CPU and prepare-sidecar fetches the arm64 opencode. Same
          # Ubuntu release as x64, so both need the same glibc.
          - name: Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux
            target: aarch64-unknown-linux-gnu
            builder_args: --linux --arm64
            update_manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - name: Enable long paths on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools rpm

      - name: Install dependencies
        shell: bash
        run: pnpm --filter @omnirush/desktop... --filter @omnirush/app... --filter omnirush-server... --filter omnirush-ui-mcp... install --frozen-lockfile --prefer-offline

      - name: Stamp release version
        shell: bash
        run: node scripts/release/stamp-version.mjs --version "$RELEASE_VERSION"

      # Decides signed or unsigned from the secrets present (see
      # apps/desktop/scripts/signing-plan.mjs); with --enforce a 3.x+ macOS or
      # Windows build without them fails.
      - name: Plan code signing
        id: signing
        env:
          MAC_CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ matrix.platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_PROFILE || '' }}
          WIN_PUBLISHER_NAME: ${{ matrix.platform == 'windows' && secrets.WIN_PUBLISHER_NAME || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        shell: bash
        run: node apps/desktop/scripts/signing-plan.mjs --platform "${{ matrix.platform }}" --version "$RELEASE_VERSION" --enforce

      - name: Build desktop application
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: pnpm --filter @omnirush/desktop build:electron

      - name: Package installer
        env:
          # electron-builder only picks the Developer ID out of the keychain it
          # builds from CSC_LINK when auto-discovery is on.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'macos' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.apple_api_key_path }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          SIGNING_ARGS_FILE: ${{ steps.signing.outputs.builder_args_file }}
        shell: bash
        run: |
          set -euo pipefail
          # electron-builder treats a defined-but-empty CSC_LINK/WIN_CSC_LINK as
          # "a certificate is present" and then fails importing it. When a secret
          # is absent it arrives here as an empty string, so drop the empties and
          # let the unsigned path run.
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -z "${!v:-}" ] && unset "$v" || true
          done
          signing_args=()
          if [ -n "${SIGNING_ARGS_FILE:-}" ] && [ -f "$SIGNING_ARGS_FILE" ]; then
            while IFS= read -r arg; do
              [ -n "$arg" ] && signing_args+=("$arg")
            done < <(node -e 'for (const a of JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))) console.log(a)' "$SIGNING_ARGS_FILE")
          fi
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            ${{ matrix.builder_args }} \
            ${signing_args[@]+"${signing_args[@]}"} \
            --publish never

      # Notarizes and staples the DMG (the app inside was notarized and stapled
      # during packaging) and refreshes its checksum in latest-mac.yml.
      - name: Notarize and staple the DMG
        if: matrix.platform == 'macos'
        env:
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.apple_api_key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: node apps/desktop/scripts/notarize-dmg.mjs

      - name: Verify macOS signing and notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: bash apps/desktop/scripts/verify-macos-signing.sh apps/desktop/dist-electron "${{ steps.signing.outputs.signed }}"

      - name: Verify Windows signatures
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./apps/desktop/scripts/verify-windows-signing.ps1 -Dist apps/desktop/dist-electron -Signed "${{ steps.signing.outputs.signed }}" -InstallCheck

      - name: Microsoft Defender scan
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist-electron -Filter "omnirush-*.exe" -File | Select-Object -First 1
          ./apps/desktop/scripts/defender-scan.ps1 -Paths $installer.FullName, apps/desktop/dist-electron/win-unpacked

      - name: Remove notarization key
        if: always() && steps.signing.outputs.apple_api_key_path != ''
        shell: bash
        run: rm -f "${{ steps.signing.outputs.apple_api_key_path }}"

      - name: Verify packaged server imports
        shell: bash
        run: node apps/desktop/scripts/verify-packaged-imports.mjs

      # electron-updater discovers updates through this manifest. A release
      # without it (or with checksums that do not match the uploaded
      # installers) leaves every installed app unable to update.
      - name: Verify update manifest
        env:
          UPDATE_MANIFEST: ${{ matrix.update_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "apps/desktop/dist-electron/$UPDATE_MANIFEST" ]; then
            echo "electron-builder did not emit apps/desktop/dist-electron/$UPDATE_MANIFEST; in-app updates would 404." >&2
            find apps/desktop/dist-electron -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          node apps/desktop/scripts/verify-update-manifest.mjs \
            --manifest "apps/desktop/dist-electron/$UPDATE_MANIFEST" \
            --version "$RELEASE_VERSION"

      - name: Verify and upload installers and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MANIFEST: ${{ matrix.update_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(apps/desktop/dist-electron/omnirush-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No packaged OmniRush.ai assets were produced." >&2
            find apps/desktop/dist-electron -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          manifest="apps/desktop/dist-electron/$UPDATE_MANIFEST"
          if [ ! -f "$manifest" ]; then
            echo "Update manifest $manifest is missing; refusing to publish installers the app cannot update to." >&2
            exit 1
          fi
          assets+=("$manifest")
          printf 'Uploading %s\n' "${assets[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Create checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'omnirush-*'
          cd release-assets
          sha256sum omnirush-* > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
