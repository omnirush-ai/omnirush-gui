name: Build Electron Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - electron-notary-test
    paths:
      - apps/app/**
      - apps/desktop/**
      - packages/ui/**
      - constants.json
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-electron-desktop.yml

permissions:
  contents: read

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so setup-node can find the
      # pnpm binary on PATH. Matches the pattern in build-desktop.yml so
      # the two workflows share the same bootstrap story.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Bun >= 1.3.10 is required by the server build and package-time helpers.
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Electron desktop (unpacked)
        env:
          OMNIRUSH_DESKTOP_SENTRY_DSN: ${{ secrets.OMNIRUSH_DESKTOP_SENTRY_DSN || vars.OMNIRUSH_DESKTOP_SENTRY_DSN }}
          OMNIRUSH_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.OMNIRUSH_DESKTOP_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
        run: pnpm --filter @omnirush/desktop package:electron:dir

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnirush-electron-${{ matrix.artifact }}
          path: apps/desktop/dist-electron/**

  electron-macos-notarization-smoke:
    name: Electron macOS notarization smoke
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same signing inputs as the release workflow's mac leg.
      - name: Write notary API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          {
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package Electron desktop (signed + notarized, no publish)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          OMNIRUSH_DESKTOP_SENTRY_DSN: ${{ secrets.OMNIRUSH_DESKTOP_SENTRY_DSN || vars.OMNIRUSH_DESKTOP_SENTRY_DSN }}
          OMNIRUSH_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.OMNIRUSH_DESKTOP_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
        run: |
          set -euo pipefail
          pnpm --filter @omnirush/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac --arm64 -c.mac.notarize=true --publish never

      - name: Verify macOS signature and notarization
        run: |
          set -euo pipefail
          app=$(find apps/desktop/dist-electron -maxdepth 2 -name '*.app' -type d | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
